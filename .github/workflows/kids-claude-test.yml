name: Sabedoria Kids - testar Claude
on:
  workflow_dispatch:
    inputs:
      provider:
        description: Servidor autorizado para receber a credencial e a imagem
        type: choice
        default: anthropic
        options:
          - anthropic
          - claude-ss
      vision:
        description: Uma chamada visual curta (pode consumir credito da API)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: kids-claude-connection-test
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test authentication and optional single image
        env:
          KIDS_VISION_ANTHROPIC_API_KEY: ${{ secrets.KIDS_VISION_ANTHROPIC_API_KEY }}
          KIDS_VISION_TEST: ${{ inputs.vision }}
          KIDS_VISION_PROVIDER: ${{ inputs.provider }}
        run: node scripts/test-kids-claude.mjs
      - name: Save diagnostic receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kids-claude-connection-test
          path: output/claude-test/result.json
          if-no-files-found: ignore
