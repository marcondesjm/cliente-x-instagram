name: Instagram Performance Learning

permissions:
  contents: write

concurrency:
  group: instagram-performance-learning
  cancel-in-progress: false

on:
  push:
    paths:
      - "scripts/collect-instagram-performance.mjs"
      - "automation/instagram-template/config/performance-learning-exclusions.json"
      - ".github/workflows/instagram-performance-learning.yml"
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

jobs:
  collect-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACCOUNT: cliente-x
      CLIENTE_X_INSTAGRAM_ACCESS_TOKEN: ${{ secrets.CLIENTE_X_INSTAGRAM_ACCESS_TOKEN }}
      CLIENTE_X_INSTAGRAM_USER_ID: ${{ secrets.CLIENTE_X_INSTAGRAM_USER_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refresh main state
        run: git pull --rebase origin main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate learning model
        run: node scripts/collect-instagram-performance.mjs --validate

      - name: Collect Instagram performance
        run: node scripts/collect-instagram-performance.mjs

      - name: Persist performance learning
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/instagram-template/config/performance-insights.json
          if git diff --cached --quiet; then
            echo "No performance changes to persist."
          else
            git commit -m "Update Instagram performance learning"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
