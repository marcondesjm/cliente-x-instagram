name: Pesquisa biblica Sabedoria Kids
on:
  workflow_dispatch:
  schedule:
    - cron: '20 8 * * *'
permissions:
  contents: write
concurrency:
  group: sabedoria-kids-source-research
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/collect-kids-sources.mjs
      - name: Salvar pesquisa sem publicar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add automation/instagram-template/config/sabedoria-kids-sources.json
          git diff --cached --quiet && exit 0
          git commit -m 'Atualiza pesquisa biblica Sabedoria Kids'
          git pull --rebase origin main
          git push origin HEAD:main
