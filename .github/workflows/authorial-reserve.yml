name: Cliente X - repor reserva autoral com Claude
on:
  workflow_dispatch:
    inputs:
      preview_only:
        description: Gerar e revisar prévia sem liberar estoque ou publicação
        type: boolean
        default: false
  schedule:
    # Estoque preventivo a cada vinte minutos, também após publicações.
    # Preflight sem API evita instalações e chamadas quando não há orçamento.
    - cron: '15,35,55 * * * *'
  workflow_run:
    workflows:
      - Instagram Feed Cliente X
      - Instagram Watchdog Backup
    branches: [main]
    types: [completed]
permissions:
  contents: write
concurrency:
  group: platform-editorial-api-validation
  cancel-in-progress: false
jobs:
  replenish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      recovery_ready: ${{ steps.result.outputs.recovery_ready }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Refresh state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
      - name: Plan automatic recovery without paid calls
        id: plan
        run: node scripts/plan-authorial-recovery.mjs --persist
      - if: steps.plan.outputs.run == 'true'
        run: npm ci --ignore-scripts
      - if: steps.plan.outputs.run == 'true' && steps.plan.outputs.recovery_ready != 'true'
        run: npx playwright install --with-deps chromium
      - name: Generate, render and independently review authorial reserve
        if: steps.plan.outputs.run == 'true' && steps.plan.outputs.recovery_ready != 'true'
        env:
          KIDS_VISION_ANTHROPIC_API_KEY: ${{ secrets.KIDS_VISION_ANTHROPIC_API_KEY }}
          AUTHORIAL_PREVIEW_ONLY: ${{ inputs.preview_only || 'false' }}
        run: node scripts/replenish-authorial-reserve.mjs --persist
      - name: Confirm eligible stock before automatic publication recovery
        id: result
        if: success() && steps.plan.outputs.run == 'true'
        run: node scripts/plan-authorial-recovery.mjs --persist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: authorial-reserve-evidence
          path: |
            output/authorial-reserve/
            automation/instagram-template/config/authorial-reserve.json
            automation/instagram-template/runs/cliente-x/
  recover:
    needs: replenish
    if: needs.replenish.outputs.recovery_ready == 'true' && inputs.preview_only != true
    uses: ./.github/workflows/instagram-watchdog-backup.yml
    secrets: inherit
