<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Status dos Tokens Meta | Cliente X</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2317211c'/%3E%3Cpath d='M18 42V22h6l8 10 8-10h6v20h-7V33l-7 9-7-9v9z' fill='%237cffb2'/%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #f6f7f5;
      --panel: #ffffff;
      --text: #17211c;
      --muted: #5d6b64;
      --line: #e2e7e3;
      --accent: #0e7c5a;
      --warn: #9f6b00;
      --bad: #b42318;
      --good: #027a48;
      --shadow: 0 12px 34px rgba(28, 44, 36, 0.07);
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 24px;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
    }
    h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }
    .subtitle {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 24px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px;
      margin-bottom: 20px;
    }
    .account-row {
      display: grid;
      grid-template-columns: 1fr auto auto auto;
      gap: 16px;
      align-items: center;
      padding: 16px 0;
      border-bottom: 1px solid var(--line);
    }
    .account-row:last-child {
      border-bottom: none;
    }
    .account-name {
      font-weight: 600;
      font-size: 16px;
    }
    .account-brand {
      color: var(--muted);
      font-size: 13px;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
    }
    .status-valid {
      background: #dcfae6;
      color: var(--good);
    }
    .status-expiring-soon {
      background: #fef3c7;
      color: var(--warn);
    }
    .status-expiring-warning {
      background: #fef3c7;
      color: var(--warn);
    }
    .status-expired, .status-invalid {
      background: #fee2e2;
      color: var(--bad);
    }
    .status-not-configured {
      background: #f3f4f6;
      color: var(--muted);
    }
    .days-left {
      font-size: 14px;
      font-weight: 600;
      text-align: right;
    }
    .alert-box {
      margin-top: 12px;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.5;
    }
    .alert-critical {
      background: #fee2e2;
      color: var(--bad);
      border: 1px solid #fecaca;
    }
    .alert-warning {
      background: #fef3c7;
      color: var(--warn);
      border: 1px solid #fde68a;
    }
    .alert-info {
      background: #dbeafe;
      color: #1e40af;
      border: 1px solid #bfdbfe;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      text-decoration: none;
    }
    .btn-primary {
      background: var(--accent);
      color: white;
    }
    .btn-primary:hover {
      background: #0c6b4d;
    }
    .loading {
      text-align: center;
      padding: 48px;
      color: var(--muted);
    }
    .error-msg {
      color: var(--bad);
      font-weight: 600;
    }
    .refresh-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .last-check {
      color: var(--muted);
      font-size: 13px;
    }
    @media (max-width: 768px) {
      .account-row {
        grid-template-columns: 1fr;
        gap: 8px;
      }
      .days-left {
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔑 Status dos Tokens Meta (Instagram)</h1>
    <p class="subtitle">Monitoramento de validade dos tokens de acesso — renovação necessária quando expirados</p>

    <div class="refresh-bar">
      <span class="last-check" id="lastCheck">Carregando...</span>
      <button class="btn btn-primary" onclick="loadStatus()">↻ Atualizar</button>
    </div>

    <div id="content">
      <div class="loading">Verificando tokens...</div>
    </div>
  </div>

  <script>
    async function loadStatus() {
      const contentEl = document.getElementById('content');
      const lastCheckEl = document.getElementById('lastCheck');

      contentEl.innerHTML = '<div class="loading">Verificando tokens...</div>';

      try {
        const res = await fetch('/api/meta-token-status');
        const data = await res.json();

        if (!data.success) {
          throw new Error(data.error || 'Erro ao carregar status');
        }

        const timestamp = new Date(data.timestamp).toLocaleString('pt-BR');
        lastCheckEl.textContent = `Última verificação: ${timestamp}`;

        if (data.accounts.length === 0) {
          contentEl.innerHTML = '<div class="card">Nenhuma conta configurada.</div>';
          return;
        }

        let html = '<div class="card">';

        for (const account of data.accounts) {
          const statusClass = getStatusClass(account.status);
          const statusLabel = getStatusLabel(account.status);
          const daysText = getDaysText(account.daysUntilExpiry, account.status);

          html += `
            <div class="account-row">
              <div>
                <div class="account-name">${escapeHtml(account.brandName || account.account)}</div>
                <div class="account-brand">${account.account}</div>
              </div>
              <span class="status-badge ${statusClass}">${statusLabel}</span>
              <div class="days-left">${daysText}</div>
              <div>${getActionLink(account)}</div>
            </div>
          `;

          if (account.alert) {
            const alertClass = account.alert.type === 'critical' ? 'alert-critical' :
                              account.alert.type === 'warning' ? 'alert-warning' : 'alert-info';
            html += `<div class="alert-box ${alertClass}"><strong>${account.alert.message}</strong><br>${account.alert.action}</div>`;
          }
        }

        html += '</div>';
        contentEl.innerHTML = html;

      } catch (err) {
        contentEl.innerHTML = `<div class="card"><span class="error-msg">Erro: ${escapeHtml(err.message)}</span></div>`;
      }
    }

    function getStatusClass(status) {
      switch (status) {
        case 'valid': return 'status-valid';
        case 'expiring_soon': return 'status-expiring-soon';
        case 'expiring_warning': return 'status-expiring-warning';
        case 'expired': return 'status-expired';
        case 'invalid': return 'status-invalid';
        case 'not_configured': return 'status-not-configured';
        default: return '';
      }
    }

    function getStatusLabel(status) {
      switch (status) {
        case 'valid': return '✅ Válido';
        case 'expiring_soon': return '⚠️ Expira em breve';
        case 'expiring_warning': return '⚠️ Atenção';
        case 'expired': return '⏰ Expirado';
        case 'invalid': return '❌ Inválido';
        case 'not_configured': return 'Não configurado';
        default: return status;
      }
    }

    function getDaysText(days, status) {
      if (status === 'not_configured') return '—';
      if (status === 'expired' || status === 'invalid') return 'Renovar agora';
      if (days !== null && days !== undefined) return `${days} dias restantes`;
      return 'Verificando...';
    }

    function getActionLink(account) {
      if (account.status === 'expired' || account.status === 'invalid') {
        return `<a href="https://developers.facebook.com/apps" target="_blank" class="btn btn-primary" style="font-size:12px;padding:6px 12px;">Renovar Token</a>`;
      }
      if (account.status === 'not_configured') {
        return `<a href="/configuracoes" class="btn btn-primary" style="font-size:12px;padding:6px 12px;">Configurar</a>`;
      }
      return '';
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Carrega ao iniciar
    loadStatus();

    // Auto-refresh a cada 5 minutos
    setInterval(loadStatus, 5 * 60 * 1000);
  </script>
</body>
</html>
